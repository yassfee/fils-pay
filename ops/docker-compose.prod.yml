# Hosted-box override (Dilmune): `docker compose -f ops/docker-compose.yml -f ops/docker-compose.prod.yml up -d`.
# Images are built off the box (1 vCPU / 2 GB RAM / 2 GB disk) and loaded with `docker load`; nothing builds here.
services:
  postgres:
    ports: !reset []          # never publish Postgres (its password is in the base file)
    restart: unless-stopped
  api:
    image: ops-api:latest
    # CAP-1: judged limits 0.5 vCPU / 512 MB. One node process (no npm/tsx wrapper processes) so the 512 MB is the
    # API's; a 384 MB V8 heap makes it GC (or exit and get restarted) before the cgroup OOM-kills it mid-request.
    command: ["node", "--import", "tsx", "apps/api/src/index.ts"]
    init: true                # CAP-3: tini is PID 1, so the health check below can kill a wedged API
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      PG_POOL_MAX: "20"       # api 20 + settlement 5 + reporting 5 of Postgres' max_connections=100
      MAX_IN_FLIGHT: "32"     # CAP-2: 503 + Retry-After past this; throughput peaked at ~30 in flight (CAPACITY.md)
    # CAP-3: docker only restarts a container that exits. A wedged API still accepts TCP but never answers:
    # 3 probe timeouts in a row kill it (restart policy brings it back). Refused connections (booting) don't count.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:2)).catch(e=>process.exit(e.cause?.code==='ECONNREFUSED'?1:2))\"; rc=$$?; [ $$rc = 0 ] && rm -f /tmp/hc && exit 0; [ $$rc = 2 ] && echo x >> /tmp/hc; [ $$(cat /tmp/hc 2>/dev/null | wc -l) -ge 3 ] && rm -f /tmp/hc && kill -9 -1; exit 1"]
      interval: 10s
      timeout: 8s
      retries: 3
  settlement:
    image: ops-settlement:latest
    restart: unless-stopped
  reporting:
    image: ops-reporting:latest
    restart: unless-stopped
  migrate:
    image: ops-migrate:latest
  seed:
    image: ops-seed:latest
    env_file: .env.local      # SEED_USER_PASSWORD / SEED_ADMIN_PASSWORD: the repo's dev seed passwords are public
  web:                        # WEB-1: Caddy serves apps/web (/, /dashboard, /pay/:token) and apps/admin, proxies /v1 to api
    image: ops-web:latest     # built by runbook §1 from ops/Dockerfile.web
    env_file: .env.local      # Caddy reads only SITE_ADDRESS / ADMIN_ADDRESS from it (ops/Caddyfile)
    environment:
      GOMEMLIMIT: 48MiB       # Go GC tightens before the 64 MB cgroup limit instead of being OOM-killed
    ports: ["80:80", "443:443", "8081:8081"]
    volumes: [caddy_data:/data]   # ACME account and certificates survive restarts and upgrades
    depends_on: [api]
    restart: unless-stopped
    cpus: 0.25                # advisor: a cap, not a reservation; 0.1 throttled the proxy (p99 +12%, CAPACITY.md)
    mem_limit: 64m
volumes:
  caddy_data:
